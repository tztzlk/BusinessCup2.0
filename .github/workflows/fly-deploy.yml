name: Deploy to Fly

on:
  push:
    branches: [main]
  workflow_dispatch:

# The token only needs to read the repo.
permissions:
  contents: read

# Only one deploy at a time; a newer push waits for the running one to finish.
concurrency:
  group: fly-deploy
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint .
      - run: npm test

  # Runs only if typecheck and tests pass, so a broken push never reaches prod.
  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to a commit: this step runs next to FLY_API_TOKEN.
      - uses: superfly/flyctl-actions/setup-flyctl@98172f70657cb3e15db199af139be99bd3e61200 # master, 2026-11-14
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      # The first request after a deploy compiles and caches each page (~7-9 s). Make it now,
      # so a judge opening the site never waits for it. Fails the job if the site doesn't answer.
      - name: Warm up the new deploy
        run: |
          for path in /api/health / /demo /demo/couple /demo/hourly /demo/salaried /check /report; do
            curl -fsS -o /dev/null --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 \
              -w "%{http_code} %{time_total}s $path\n" "https://paytrail-enushniki.fly.dev$path"
          done
