# App name must be globally unique on Fly. Change it if `fly launch` says it is taken.
app = "paytrail-enushniki"
primary_region = "fra"

[build]

[env]
  DB_PATH = "/data/paytrail.db"

[http_service]
  internal_port = 3000
  force_https = true
  # Keep one machine always on: the jury must not wait for a cold start,
  # and the SQLite volume is attached to exactly one machine.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "paytrail_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpus = 1
